services:
  tb3_sim:
    build:
      context: ./turtlebot3-sim
      dockerfile: Dockerfile
    image: turtlebot3-sim:latest
    container_name: tb3_sim
    environment:
      DISPLAY: ":0"
      WAYLAND_DISPLAY: "wayland-0"
      XDG_RUNTIME_DIR: "/mnt/wslg/runtime-dir"
      PULSE_SERVER: "/mnt/wslg/PulseServer"
      QT_X11_NO_MITSHM: 1
      ROS_DOMAIN_ID: 30
      TURTLEBOT3_MODEL: burger
      GAZEBO_MODEL_PATH: "/opt/ros/humble/share/turtlebot3_gazebo/models:/usr/share/gazebo-11/models"
      ROS_LOG_DIR: /root/maps/ros_logs
    networks: [ros_net]
    ports: ["9090:9090"]
    volumes:
      - ./maps:/root/maps
      - /run/desktop/mnt/host/wslg/.X11-unix:/tmp/.X11-unix
      - /run/desktop/mnt/host/wslg:/mnt/wslg

  ui_gateway:
    build:                # <– usa el Dockerfile dentro de ui_web/
      context: ./ui_web
      dockerfile: Dockerfile
    ports:
      - "8080:80"         # imagen Nginx
    environment:
      - VITE_ROSBRIDGE_URL=ws://localhost:9090
      - VITE_API_URL=http://rest_api:5000
    networks: [ros_net]

    ### MongoDB ### ### REST API ###
  mongodb:
    image: mongo:7
    volumes: [mongo_data:/data/db, ./maps:/maps]
    networks: [ros_net]
    environment:
      MONGO_INITDB_DATABASE: agv

  api:
    build: ./api
    depends_on: [mongodb]
    environment:
      AGV_MONGO_URI: mongodb://mongodb:27017/agv
      AGV_MAPS_DIR: /maps
      AGV_CORS_ORIGINS: http://localhost:5173
      AGV_ROSBRIDGE_URL: ws://tb3_sim:9090
    volumes: [./maps:/maps]
    networks: [ros_net]
    ports: ["5000:8000"]

volumes: { mongo_data: {} }


networks:
  ros_net:
    name: ros_net
    external: true
